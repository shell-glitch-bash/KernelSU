name: Sync upstream
on:
  schedule:
    - cron: '17 18 * * *'    # 每天 UTC 18:17（北京时间凌晨 2:17），错峰
  workflow_dispatch:          # 保留手动触发按钮

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git config user.name "star-in-oss"
          git config user.email "star-in-oss@users.noreply.github.com"
          git remote add upstream https://github.com/tiann/KernelSU.git
          git fetch upstream
          git merge upstream/main -m "chore: sync upstream" || exit 0
          git push origin main

  release:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Tag and release if there are unreleased commits
        run: |
          git config user.name "star-in-oss"
          git config user.email "star-in-oss@users.noreply.github.com"
          LAST=$(git describe --tags --match 'v*-s*' --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST" ] && [ "$(git rev-parse HEAD)" = "$(git rev-parse "$LAST^{commit}")" ]; then
            echo "HEAD already released as $LAST, nothing to do"
            exit 0
          fi
          BASE=$(echo "${LAST:-v0.0.0-s0}" | sed -E 's/^(.*-s)[0-9]+$/\1/')
          N=$(echo "${LAST:-v0.0.0-s0}" | sed -E 's/^.*-s([0-9]+)$/\1/')
          NEW="${BASE}$((N+1))"
          echo "Creating release tag $NEW (last was ${LAST:-none})"
          git tag "$NEW"
          git push origin "$NEW"
