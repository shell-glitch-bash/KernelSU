name: Sync upstream
on:
  schedule:
    - cron: '17 18 * * *'  # 每天 UTC 18:17（北京时间凌晨 2:17），错峰、降低被 suspended 的概率
  workflow_dispatch:          # 保留手动触发按钮（被暂停后靠它复活）

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git config user.name "shell-glitch-bash"
          git config user.email "shell-glitch-bash@users.noreply.github.com"
          git remote add upstream https://github.com/tiann/KernelSU.git
          git fetch upstream --tags
          git merge upstream/main -m "chore: sync upstream" || { echo "::warning::上游合并失败或存在冲突，本次同步跳过，请人工处理"; exit 0; }
          git push origin main

  release:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Tag and release if there are unreleased commits
        run: |
          git config user.name "shell-glitch-bash"
          git config user.email "shell-glitch-bash@users.noreply.github.com"
          git remote add upstream https://github.com/tiann/KernelSU.git
          git fetch upstream --tags

          # 1) 当前代码里包含的最新官方版本号（用 grep 排除 -s 后缀的 fork tag，
          #    注意：git tag 没有 --exclude 选项，之前那版会报错并退化成 v0.0.0）
          UPSTREAM_BASE=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vE -- '-s[0-9]+$' | head -1)
          UPSTREAM_BASE=${UPSTREAM_BASE:-v0.0.0}
          echo "Upstream base: $UPSTREAM_BASE"

          # 2) 上一个 fork 构建 tag（vX.Y.Z-sN 格式）
          LAST=$(git tag --list '*-s*' --sort=-v:refname | head -1 || true)
          echo "Last fork tag: ${LAST:-none}"

          # 3) HEAD 已经发布过就无事发生
          if [ -n "$LAST" ] && [ "$(git rev-parse HEAD)" = "$(git rev-parse "$LAST^{commit}")" ]; then
            echo "HEAD already released as $LAST, nothing to do"
            exit 0
          fi

          # 4) 计算序号：官方版本变了 → 重置为 1；没变 → 接着 +1
          if [ -z "$LAST" ]; then
            N=1
          else
            LAST_BASE="${LAST%-s*}"     # v1.0.330-s5 -> v1.0.330
            LAST_N="${LAST##*-s}"       # v1.0.330-s5 -> 5
            case "$LAST_N" in
              ''|*[!0-9]*) LAST_N=0 ;;
            esac
            if [ "$LAST_BASE" = "$UPSTREAM_BASE" ]; then
              N=$((LAST_N + 1))
            else
              N=1
            fi
          fi

          NEW="${UPSTREAM_BASE}-s${N}"
          echo "Creating release tag $NEW (last was ${LAST:-none})"
          git tag "$NEW"
          git push origin "$NEW"
