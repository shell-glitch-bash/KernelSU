name: Sync upstream
on:
  schedule:
    - cron: '17 18 * * *'    # 每天 UTC 18:17（北京时间凌晨 2:17），错峰
  workflow_dispatch:          # 保留手动触发按钮

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git config user.name "star-in-oss"
          git config user.email "star-in-oss@users.noreply.github.com"
          git remote add upstream https://github.com/tiann/KernelSU.git
          git fetch upstream
          git merge upstream/main -m "chore: sync upstream" || exit 0
          git push origin main
